app-id: org.zim_wiki.Zim
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    directory: texlive
    version: '26.08'
    no-autodownload: true
    autodelete: false
command: zim
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # libappindicator access
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  # zim opens files/links with host apps via flatpak-spawn --host (zim/applications.py)
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --env=PATH=/app/bin:/usr/bin:/app/texlive-bin:/app/texlive/bin
  - --env=TMPDIR=/var/tmp
cleanup:
  - /share/gtk-doc
  - /share/gnome/help
modules:
  - name: graphviz
    buildsystem: autotools
    config-opts:
      - --disable-tcl
    cleanup:
      - /share/graphviz/doc
    sources:
      - type: archive
        url: >-
          https://gitlab.com/graphviz/graphviz/-/archive/16.1.0/graphviz-16.1.0.tar.bz2
        sha256: f6ae3cafc0c4778bb1eaf6f1ee7cd0410208089b239099186f87cf04f60cc5d4
        x-checker-data:
          type: anitya
          project-id: 1249
          stable-only: true
          url-template: >-
            https://gitlab.com/graphviz/graphviz/-/archive/$version/graphviz-$version.tar.bz2
  - name: pygtkspellcheck
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation pyenchant pygtkspellcheck
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/36/ad/64925c937e41be75c7067c85757b3d45b148e9111187b37693269f583156/pyenchant-3.3.0.tar.gz
        sha256: 825288246b5debc9436f91967650974ef0d5636458502619e322c476f1283891
      - type: file
        url: https://files.pythonhosted.org/packages/01/87/e199ed6165f2e08492f6e8d44ef3d8824e473a2cf3be94cc19d5a6f8a3ae/pygtkspellcheck-5.0.4-py3-none-any.whl
        sha256: e578d950046ed7b15487d00ea72ad39d33bdd85f61114f75caa4bdf28cd0aa3f
  - name: python-pyxdg
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app
    sources:
      - type: archive
        url: >-
          https://files.pythonhosted.org/packages/b0/25/7998cd2dec731acbd438fbf91bc619603fc5188de0a9a17699a781840452/pyxdg-0.28.tar.gz
        sha256: 3267bb3074e934df202af2ee0868575484108581e6f3cb006af1da35395e88b4
  - shared-modules/libappindicator/libappindicator-gtk3-introspection-12.10.json
  - name: xdot
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app --root=/
    sources:
      - type: archive
        url: >-
          https://files.pythonhosted.org/packages/32/68/13f80d47bffda03eaf05bd076d1b2ef9a1cf39b461b37e32f303bcf048de/xdot-1.6.tar.gz
        sha256: ebddefc3e3aa9fd8b2e2ed884ed844043f843428b79dccda831803add55cc51d
    modules:
      - name: numpy
        buildsystem: simple
        build-commands:
          - ./vendored-meson/meson/meson.py setup builddir --buildtype=debugoptimized
            --prefix=${FLATPAK_DEST}
          - cd builddir && ninja
          - cd builddir && ninja install
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/95/b0/c7453d0b6e2073c3264468b106ee1563750cecc910965e67357e3698c83e/numpy-2.5.4.tar.gz
            sha256: 9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a
        cleanup:
          - /bin
          - /lib/python3.*/site-packages/numpy/core/include
          - /lib/python3.*/site-packages/numpy/core/lib/libnpymath.a
          - /lib/python3.*/site-packages/numpy/tests
          - /lib/python3.*/site-packages/numpy/*/tests
  - name: gtksourceview
    buildsystem: meson
    sources:
      - type: archive
        # latest version that supports GTK3
        url: https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz
        sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d
  - name: zim
    buildsystem: simple
    build-commands:
      - python3 setup.py build
      - python3 setup.py install --prefix=/app --skip-build
      - find /app/share/icons/ -name 'application-x-zim-notebook.*' -exec rename application
        org.zim_wiki.Zim-application '{}' \;
      - mkdir /app/texlive
      - ln -s texlive/bin/${FLATPAK_ARCH}-linux /app/texlive-bin
    sources:
      - type: archive
        url: https://zim-wiki.org/downloads/zim-0.77.2.tar.gz
        sha256: 5561bed05a5fe4208da2ef8d5f8747ebc49e8cb32b46df2559cc73fb11fa65eb
        x-checker-data:
          type: anitya
          project-id: 5301
          stable-only: true
          url-template: https://zim-wiki.org/downloads/zim-$version.tar.gz
      - type: patch
        path: mimetype-icon.patch
      - type: patch
        path: appdata-fixes.patch
